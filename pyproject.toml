[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=main --cov-report=term-missing --cov-report=xml --cov-fail-under=75"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["main.py", "ui.py", "tests"]
