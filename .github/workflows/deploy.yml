name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-render:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'dev'
      )
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      smoke_test_url: ${{ steps.resolve-smoke-test-url.outputs.url }}

    steps:
      - name: Verify Render deploy hook is configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "Add the Render deploy hook secret before enabling automatic deployments from dev."
            exit 1
          fi

      - name: Announce deployment target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual deployment trigger requested."
          else
            echo "Deploying after successful CI on branch: ${{ github.event.workflow_run.head_branch }}"
            echo "Validated commit: ${{ github.event.workflow_run.head_sha }}"
          fi

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Resolve smoke test URL
        id: resolve-smoke-test-url
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "No RENDER_SERVICE_URL repository variable is configured."
            echo "Post-deploy smoke test will be skipped."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Using smoke test URL: $RENDER_SERVICE_URL"
          echo "url=$RENDER_SERVICE_URL" >> "$GITHUB_OUTPUT"

  smoke-test-render:
    needs: deploy-to-render
    if: needs.deploy-to-render.result == 'success' && needs.deploy-to-render.outputs.smoke_test_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - name: Wait for Render service to become healthy
        env:
          SMOKE_TEST_URL: ${{ needs.deploy-to-render.outputs.smoke_test_url }}
        run: |
          for attempt in $(seq 1 40); do
            status_code=$(curl --silent --show-error --location --output /tmp/render-response.txt --write-out "%{http_code}" "$SMOKE_TEST_URL" || true)

            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
              echo "Smoke test passed with HTTP $status_code on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt returned HTTP ${status_code:-curl-error}. Waiting for deployment to finish..."
            sleep 15
          done

          echo "Render service did not become healthy in time."
          echo "Last response body:"
          cat /tmp/render-response.txt || true
          exit 1
